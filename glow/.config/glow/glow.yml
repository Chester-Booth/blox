# style name or JSON path (default "auto")
# GLOW_STYLE supplies the absolute XDG-aware managed path. Glow 2.1.2 passes
# unexpanded config paths to Glamour, so neither "~" nor "$XDG_CONFIG_HOME"
# is safe here.
style: "auto"
# mouse wheel support (TUI-mode only)
mouse: true
# use pager to display markdown
pager: false
# word-wrap at width
width: 80
# show all files, including hidden and ignored.
all: false
